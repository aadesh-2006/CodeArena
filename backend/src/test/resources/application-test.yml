spring:
  datasource:
    url: jdbc:h2:mem:codearenatest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

codearena:
  jwt:
    secret: test_jwt_secret_key_must_be_minimum_32_characters_long_for_security!
    expiration-ms: 3600000
